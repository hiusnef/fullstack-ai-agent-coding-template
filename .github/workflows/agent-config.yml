name: agent-config
on:
  push:
    branches: [main]
  pull_request:
    paths: [".ai/**", "scripts/sync_agents.py", "AGENTS.md", "CLAUDE.md", ".claude/**", ".agents/**", ".github/**", ".cursor/**", ".codex/**", ".vscode/**", ".mcp.json"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/sync_agents.py --check
